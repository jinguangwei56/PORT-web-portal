<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06283b">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>FONKON供应链路线决策报告</title>
  <style>
    :root{--navy:#06283b;--navy2:#0a3d52;--teal:#07877e;--cyan:#0da9c1;--mint:#d8fbf4;--ink:#0f1e33;--muted:#65768a;--line:#dbe5ec;--paper:#f3f7fa;--white:#fff;--good:#087a67;--warn:#9a6700;--bad:#a63a3a;--shadow:0 22px 60px rgba(5,35,53,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#e9f4f6 0,#f5f8fb 420px,#f5f8fb 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
    button,input{font:inherit}.topbar{position:sticky;top:0;z-index:20;background:rgba(6,40,59,.96);backdrop-filter:blur(16px);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}.topbar-in{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#15c7b5,#11a9ce);display:grid;place-items:center;font-weight:950;font-size:21px}.brand b{letter-spacing:.05em}.brand small{display:block;color:#9bdce3;font-size:11px;letter-spacing:.16em}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#11b7a4,#0c9fc1);color:#fff}.btn-soft{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
    main{max-width:1180px;margin:auto;padding:34px 22px 72px}.hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-140px;top:-190px;background:radial-gradient(circle,rgba(52,211,183,.34),transparent 68%)}.eyebrow{color:#5eead4;font-weight:900;letter-spacing:.18em;font-size:12px}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.12;margin:14px 0 8px;max-width:760px}.hero-sub{font-size:16px;color:#c6dce5}.scope{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:13px}.hero-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px;position:relative;z-index:1}.hero-metric{padding:16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.hero-metric span{display:block;color:#b7d1dc;font-size:12px}.hero-metric b{font-size:24px}.confidence.good{color:#80f3d9}.confidence.warn{color:#ffd77b}
    .section{margin-top:22px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(5,35,53,.06)}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.section-title h2{margin:0;font-size:21px}.section-title p{margin:0;color:var(--muted);font-size:13px}.summary{font-size:20px;font-weight:800;line-height:1.65}.notice{border-radius:16px;padding:14px 16px;margin-top:14px;background:#eefaf7;border:1px solid #b8eee2;color:#0c665c}.notice.warn{background:#fff9e8;border-color:#f1dca0;color:#7b5800}
    .route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.route{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.route.jiangmen{border-color:#87d9cc;background:linear-gradient(180deg,#f2fffc,#fff)}.route-top{display:flex;justify-content:space-between;gap:10px}.route h3{margin:0}.score{min-width:64px;text-align:center;border-radius:13px;padding:8px;background:#edf3f6}.score b{font-size:22px;display:block}.score small{color:var(--muted)}.path{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:18px 0}.node{padding:6px 9px;border-radius:10px;background:#edf7f7;color:#174b54;font-size:12px;font-weight:750}.arrow{color:#0b9f9b;font-weight:900}.route-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.matrix{border-collapse:collapse;width:100%;min-width:760px}.matrix th,.matrix td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.matrix th{background:#f2f6f8;font-size:12px;color:#536679;position:sticky;top:0}.matrix .group td{background:#eef8f7;color:#12645d;font-weight:900}.matrix .winner{background:#e5fbf4;color:#08735f;font-weight:900}.pending{color:#91a0ae}.win{display:inline-block;margin-left:6px;font-size:10px;border-radius:999px;padding:2px 6px;background:#0f9c85;color:#fff}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{margin:0;padding-left:20px}.list li{margin:7px 0}.good-box{border-top:4px solid #0b9c84}.gap-box{border-top:4px solid #d99931}.recommend{background:linear-gradient(135deg,#e8fbf7,#e9f8fc);border-color:#a9e2dc}.recommend strong{font-size:20px;color:#086f66}.fine{font-size:12px;color:var(--muted)}.foot{margin-top:26px;padding:18px;text-align:center;color:#718194;font-size:12px}
    .state{max-width:620px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;box-shadow:var(--shadow)}.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #dce9ed;border-top-color:#10a99c;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.code-form{display:grid;gap:12px;margin-top:18px}.code-form input{width:100%;padding:13px 14px;border:1px solid #c9d6de;border-radius:13px;font-size:18px;text-align:center;letter-spacing:.12em}.code-form .btn{background:linear-gradient(135deg,#0b9489,#0c9fbd);color:#fff}
    .dialog{position:fixed;inset:0;z-index:50;background:rgba(4,25,38,.72);display:none;place-items:center;padding:20px}.dialog.open{display:grid}.dialog-card{background:#fff;border-radius:22px;padding:24px;max-width:340px;width:100%;text-align:center}.dialog-card h3{margin-top:0}.dialog-card canvas{max-width:100%;height:auto}.dialog-card .btn{margin-top:12px;background:#edf2f5;color:#23364b}
    @media(max-width:720px){.topbar-in{padding:11px 14px}.brand small{display:none}.actions .btn{padding:8px 10px;font-size:12px}main{padding:18px 14px 96px}.hero{padding:24px 20px;border-radius:22px}.hero-metrics{grid-template-columns:1fr 1fr}.hero-metric:last-child{grid-column:1/-1}.card{padding:18px;border-radius:18px}.two{grid-template-columns:1fr}.summary{font-size:17px}.section-title{align-items:flex-start;flex-direction:column}.route-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.topbar,.dialog{display:none!important}main{max-width:none;padding:0}.hero,.card{box-shadow:none;break-inside:avoid}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.section{break-inside:avoid}.matrix th{position:static}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <div class="brand"><div class="logo">F</div><div><b>FONKON</b><small>GLOBAL SUPPLY CHAIN</small></div></div>
      <div class="actions"><button class="btn btn-soft" id="shareBtn">分享</button><button class="btn btn-soft" id="qrBtn">二维码</button><button class="btn btn-primary" id="pdfBtn">保存PDF</button></div>
    </div>
  </header>
  <main id="app"><div class="state"><div class="spinner"></div><b>正在读取安全报告…</b><p class="fine">报告数字来自生成时的数据快照。</p></div></main>
  <div class="dialog" id="qrDialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle"><div class="dialog-card"><h3 id="qrTitle">扫码打开本报告</h3><canvas id="qrCanvas" width="240" height="240"></canvas><p class="fine" id="qrHelp">二维码仅包含当前安全分享链接。</p><button class="btn" id="closeQr">关闭</button></div></div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
  <script>
  (()=>{
    const ENDPOINT='https://rkunyhugitvglxkdolgz.supabase.co/functions/v1/route-report';
    const app=document.getElementById('app'),token=new URLSearchParams(location.search).get('t')||'';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const n=v=>v===null||v===undefined||v===''?null:Number(v);
    const fmt=(v,unit='')=>n(v)===null?'<span class="pending">待补</span>':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2})+(unit?' '+esc(unit):'');
    const date=v=>v?new Date(v).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
    const statusError=(message,detail='')=>{app.innerHTML='<div class="state"><h2>'+esc(message)+'</h2><p class="fine">'+esc(detail)+'</p></div>'};
    function codePrompt(meta,error=''){
      app.innerHTML='<div class="state"><div class="logo" style="margin:0 auto">F</div><h2>'+esc(meta.title||'受保护的FONKON报告')+'</h2><p class="fine">报告编号 '+esc(meta.report_number||'')+'</p>'+(error?'<div class="notice warn">'+esc(error)+'</div>':'')+'<form class="code-form" id="codeForm"><input id="reportCode" type="password" inputmode="text" autocomplete="one-time-code" placeholder="请输入访问密码" required><button class="btn">打开报告</button></form></div>';
      document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();load(document.getElementById('reportCode').value)};
    }
    function metricTable(report){
      const routes=report.routes||[],rows=report.comparison?.rows||[];let html='<div class="table-wrap"><table class="matrix"><thead><tr><th>对比维度</th><th>指标</th>'+routes.map(r=>'<th>'+esc(r.name)+'</th>').join('')+'</tr></thead><tbody>';
      for(const group of rows){html+='<tr class="group"><td colspan="'+(routes.length+2)+'">'+esc(group.label)+(group.comparable?'':' · 当前不可比较')+'</td></tr>';for(const m of group.metrics){html+='<tr><td></td><td><b>'+esc(m.label)+'</b></td>'+routes.map((r,i)=>'<td class="'+((m.winners||[]).includes(i)?'winner':'')+'">'+fmt(m.values?.[i],m.unit)+((m.winners||[]).includes(i)&&m.comparable?'<span class="win">领先</span>':'')+'</td>').join('')+'</tr>'}}
      return html+'</tbody></table></div>';
    }
    function routeCards(report){const scores=report.comparison?.scores||[];return '<div class="route-grid">'+(report.routes||[]).map((r,i)=>'<article class="route '+(r.kind==='jiangmen'?'jiangmen':'')+'"><div class="route-top"><div><div class="eyebrow" style="color:#0b9385">'+esc(r.kind==='jiangmen'?'FONKON PROPOSAL':'CURRENT / ALTERNATIVE')+'</div><h3>'+esc(r.name)+'</h3></div><div class="score"><b>'+esc(scores[i]?.score??'-')+'</b><small>综合分</small></div></div><div class="path">'+(r.path||[]).map((x,j)=>'<span class="node">'+esc(x)+'</span>'+(j<(r.path||[]).length-1?'<span class="arrow">→</span>':'')).join('')+'</div><div class="route-meta"><span>运输：'+esc(r.transport||'-')+'</span><span>证据：'+esc(r.evidence?.route||'-')+'级</span><span>样本：'+esc(r.evidence?.sample_size??'待补')+'</span><span>更新：'+esc(r.evidence?.updated_at?date(r.evidence.updated_at).slice(0,10):'待补')+'</span></div></article>').join('')+'</div>'}
    function list(items,empty){return items?.length?'<ul class="list">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="fine">'+esc(empty)+'</p>'}
    function render(r){
      document.title=(r.client_name||'客户')+'｜FONKON供应链路线决策报告';const c=r.comparison||{},s=r.scope||{};
      const confidence=Number(c.confidence||0),leader=c.leader_index===null||c.leader_index===undefined?null:r.routes?.[c.leader_index];
      app.innerHTML='<section class="hero"><div class="eyebrow">FONKON SUPPLY CHAIN DECISION REPORT</div><h1>'+esc(r.title||'供应链路线决策报告')+'</h1><div class="hero-sub">'+esc(r.client_name||'贵司')+' · 报告编号 '+esc(r.report_number||'-')+'</div><div class="scope">'+[s.cargo_group,s.fruit,s.country,s.origin_region,s.month?s.month+'月':'',s.destination].filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="hero-metrics"><div class="hero-metric"><span>可比全链路维度</span><b>'+esc(c.dimension_count??0)+'/10</b></div><div class="hero-metric"><span>数据可信度</span><b class="confidence '+(confidence>=60?'good':'warn')+'">'+esc(confidence)+'%</b></div><div class="hero-metric"><span>当前综合领先</span><b>'+esc(leader?.name||'待补数据')+'</b></div></div></section>'+
      '<section class="section card"><div class="section-title"><h2>决策摘要</h2><p>数字由固定模型计算，未知不按0处理</p></div><div class="summary">'+esc(c.summary||'待补数据后判断')+'</div><div class="notice '+(confidence<60?'warn':'')+'">'+(confidence<60?'当前数据可信度不足，仅供初步方案评估，建议补齐关键数据或通过试柜验证。':'当前数据达到可比较条件，仍建议通过真实试柜持续校准。')+'</div></section>'+
      '<section class="section card"><div class="section-title"><h2>路线全链路</h2><p>同起点、同终点、同水果、同月份</p></div>'+routeCards(r)+'</section>'+
      '<section class="section card"><div class="section-title"><h2>10维度同口径对比</h2><p>P50看常态，P90看旺季和尾部风险</p></div>'+metricTable(r)+'</section>'+
      '<section class="section two"><div class="card good-box"><div class="section-title"><h2>江门当前优势</h2></div>'+list(c.jiangmen_advantages,'当前已知维度尚未形成明确优势。')+'</div><div class="card gap-box"><div class="section-title"><h2>江门当前短板</h2></div>'+list(c.jiangmen_gaps,'当前已知维度未发现明显短板。')+'</div></section>'+
      '<section class="section card recommend"><div class="section-title"><h2>FONKON行动建议</h2></div><strong>'+esc(c.recommendation||'待补数据后判断')+'</strong></section>'+
      '<section class="section two"><div class="card"><div class="section-title"><h2>比较口径</h2></div><p>'+esc(r.assumptions||'-')+'</p></div><div class="card"><div class="section-title"><h2>报告信息</h2></div><p class="fine">生成时间：'+esc(date(r.created_at))+'<br>分享有效期：'+esc(date(r.expires_at))+'<br>FONKON顾问：'+esc(r.prepared_by?.name||'-')+(r.prepared_by?.email?'<br>'+esc(r.prepared_by.email):'')+'</p></div></section>'+
      '<section class="section card"><div class="section-title"><h2>数据声明</h2></div><p class="fine">'+esc(r.disclaimer||'')+'</p></section><div class="foot">FONKON · 数据量化，链接全球水果价值。</div>';
    }
    async function load(code=''){
      if(!token)return statusError('分享链接无效','缺少安全报告凭证。');
      try{const res=await fetch(ENDPOINT+'?token='+encodeURIComponent(token),{cache:'no-store',headers:code?{'x-report-code':code}:{}}),body=await res.json().catch(()=>({}));if(res.status===401&&body.requires_code)return codePrompt(body,body.error||'');if(!res.ok)throw Error(body.error||'报告暂时无法打开');render(body.report)}catch(e){statusError(e.message||'报告暂时无法打开','请联系向您发送报告的FONKON业务顾问。')}
    }
    document.getElementById('pdfBtn').onclick=()=>window.print();
    document.getElementById('shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:'FONKON供应链路线决策报告',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('报告链接已复制')}}catch{}}
    document.getElementById('qrBtn').onclick=()=>{const d=document.getElementById('qrDialog'),canvas=document.getElementById('qrCanvas'),help=document.getElementById('qrHelp');d.classList.add('open');if(window.QRCode?.toCanvas)window.QRCode.toCanvas(canvas,location.href,{width:240,margin:1,color:{dark:'#06283b',light:'#ffffff'}},e=>{if(e)help.textContent='二维码生成失败，请使用“分享”复制链接。'});else help.textContent='二维码组件正在加载，请稍后重新打开。'};
    document.getElementById('closeQr').onclick=()=>document.getElementById('qrDialog').classList.remove('open');document.getElementById('qrDialog').onclick=e=>{if(e.target.id==='qrDialog')e.currentTarget.classList.remove('open')};
    load();
  })();
  </script>
</body>
</html>
