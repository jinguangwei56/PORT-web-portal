on></div><div id="nav" class="nav"><button data-v="dash" class="active">主管看板</button><button data-v="customers">客户</button><button data-v="opps">商机</button><button data-v="visit">15分钟拜访</button><button data-v="knowledge">基础数据库</button><button data-v="team">团队账号</button></div><div id="view"></div><div class="footer">FONKON 市场开发体系 1.2｜真实数据驱动市场开发</div></div></div><script>const U='https://rkunyhugitvglxkdolgz.supabase.co',K='sb_publishable_rrP7uAmT3NfQm9-WEM9yOw__jhzha_3',FN=U+'/functions/v1/fonkon-market-os';let ses=null,prof=null,customers=[],opps=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function badge(x){let c=x==='红'?'red':x==='橙'?'orange':x==='黄'?'yellow':x==='绿'?'green':'blue';return '<span class="badge '+c+'">'+esc(x||'-')+'</span>'}function grade(x){return x>=90?'S':x>=75?'A':x>=60?'B':x>=40?'C':'D'}function vol(n){n=+n||0;return n>=3000?20:n>=1000?18:n>=500?16:n>=300?12:n>=100?8:n>=50?5:n>0?2:0}function ev(x){return {A:100,B:85,C:70,D:45,'未知':25}[x]||25}function clamp(x,a,b){return Math.max(a,Math.min(b,x))}function comp(o,ks){return Math.round(ks.filter(k=>o[k]!==''&&o[k]!=null).length/ks.length*100)}async function req(p,o={}){let h=Object.assign({apikey:K,'content-type':'application/json'},o.headers||{});if(ses)h.authorization='Bearer '+ses.access_token;let r=await fetch(U+p,Object.assign({},o,{headers:h})),t=await r.text(),j;try{j=t?JSON.parse(t):null}catch{j=t}if(!r.ok)throw Error(j?.message||j?.error_description||j?.error||'HTTP '+r.status);return j}async function edge(b){let h={'content-type':'application/json',apikey:K};if(ses)h.authorization='Bearer '+ses.access_token;let r=await fetch(FN,{method:'POST',headers:h,body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}function save(x){ses=x;localStorage.setItem('fonkon_session',JSON.stringify(x))}function clear(){ses=null;prof=null;localStorage.removeItem('fonkon_session')}async function profile(){let a=await req('/rest/v1/profiles?id=eq.'+ses.user.id+'&select=*');prof=a[0]||null;if(!prof)throw Error('账号未激活')}async function refresh(){customers=await req('/rest/v1/customers?select=*&order=cv_score.desc&limit=500');opps=await req('/rest/v1/opportunities?select=*&order=final_priority.desc&limit=500')}function show(){if(!ses||!prof){$('#auth').classList.remove('hide');$('#app').classList.add('hide');return}$('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#who').textContent=(prof.name||ses.user.email)+'｜'+prof.role;render('dash')}$('#tl').onclick=function(){this.classList.add('active');$('#tr').classList.remove('active');$('#login').classList.remove('hide');$('#reg').classList.add('hide')};$('#tr').onclick=function(){this.classList.add('active');$('#tl').classList.remove('active');$('#reg').classList.remove('hide');$('#login').classList.add('hide')};$('#login').onsubmit=async e=>{e.preventDefault();try{$('#msg').textContent='登录中…';let x=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:$('#le').value,password:$('#lp').value})});save(x);await profile();await refresh();$('#msg').textContent='';show()}catch(z){clear();$('#msg').textContent=z.message}};$('#reg').onsubmit=async e=>{e.preventDefault();try{$('#msg').textContent='创建账号中…';await edge({action:'register',name:$('#rn').value,email:$('#re').value,password:$('#rp').value,code:$('#rc').value});$('#msg').textContent='注册成功，请切换登录';$('#tl').click();$('#le').value=$('#re').value}catch(z){$('#msg').textContent=z.message}};$('#out').onclick=()=>{clear();show()};$('#nav').onclick=e=>{if(!e.target.dataset.v)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b===e.target));render(e.target.dataset.v)};function calcC(o){let v=vol(o.annual_containers),cv=Math.min(100,v+(+o.q_score||0)+(+o.p_score||0)+(+o.t_score||0)+(+o.r_score||0)+(+o.m_score||0)+(+o.f_score||0)+(+o.w_score||0)),cp=comp(o,['company_name','contact_name','customer_type','decision_power','annual_containers','core_fruits','origin_countries','current_ports','transport_mode','p_score','f_score']),ec=ev(o.evidence_level),dc=Math.round(cp*ec/100);return {v,cv,g:grade(cv),cp,ec,dc}}function aq(o){let n=+o.switchable_volume||0;return n>=300?100:n>=150?85:n>=80?70:n>=30?55:n>0?35:0}function calcO(o,c){let ot=(+o.demand_score||0)+(+o.timing_score||0)+(+o.behavior_score||0)+(+o.decision_score||0)+(+o.competition_score||0),pi=(+c.cv_score||0)*ot/100,epi=pi*(+c.dc_score||0)/100,cur=+o.current_total_days||0,jm=+o.jiangmen_total_days||0,time=clamp((cur-jm)*7,0,20),con=clamp((+o.current_queue_hours||0)/24*15,0,15),reg=clamp((+o.inspection_rate||0)*.08+(+o.testing_rate||0)*.12+((+o.inspection_days||0)+(+o.testing_days||0))*.6,0,15),sea=clamp(+o.season_pressure||0,0,10),vp=(+o.matchable_volume||0)>=300?10:(+o.matchable_volume||0)>=100?7:(+o.matchable_volume||0)>=50?5:(+o.matchable_volume||0)>0?3:0,eff=jm>0&&cur>0?clamp((cur/jm-1)*18,0,15):0,cost=(+o.current_cost_per_container||0)>0&&(+o.jiangmen_cost_per_container||0)>0?((+o.jiangmen_cost_per_container<=+o.current_cost_per_container)?5:(+o.jiangmen_cost_per_container-(+o.current_cost_per_container)<=500?4:+o.jiangmen_cost_per_container-(+o.current_cost_per_container)<=1000?3:+o.jiangmen_cost_per_container-(+o.current_cost_per_container)<=2000?1:0)):0,intent=clamp((+o.behavior_score||0)/25*10,0,10),sw=clamp(time+con+reg+sea+vp+eff+cost+intent,0,100),final=clamp(epi*.55+sw*.30+aq(o)*.15,0,100),dp=+c.decision_power||0,alert=dp<5?'蓝':(+c.dc_score||0)<50?'黄':final>=80?'红':final>=65?'橙':final>=50?'黄':'绿',rec=alert==='蓝'?'优先找到真实货主/物流决策人':alert==='红'?'48小时内提交试柜方案并由负责人介入':alert==='橙'?'48小时内补方案/报价并推进试柜':alert==='黄'?'补齐关键数据并验证切换条件':'培育维护，不占用过多拜访时间';return {ot:Math.round(ot),pi:+pi.toFixed(1),epi:+epi.toFixed(1),sw:+sw.toFixed(1),final:+final.toFixed(1),alert,rec}}function render(v){if(v==='customers')return customersView();if(v==='opps')return oppView();if(v==='visit')return visitView();if(v==='knowledge')return knowView();if(v==='team')return teamView();dashView()}function oppTable(a){if(!a.length)return '<div class="empty">暂无商机数据</div>';return '<div class="table"><table><tr><th>客户</th><th>水果</th><th>东/西</th><th>OT</th><th>EPI</th><th>切换指数</th><th>优先分</th><th>灯号</th><th>建议</th></tr>'+a.map(x=>{let c=customers.find(y=>y.id===x.customer_id);return '<tr><td>'+esc(c?.company_name||'')+'</td><td>'+esc(x.fruit)+'</td><td>'+esc(x.cargo_group)+'</td><td>'+esc(x.ot_score)+'</td><td>'+esc(x.epi_score)+'</td><td>'+esc(x.cargo_group==='东货'?x.lsoi_score:x.psoi_score)+'</td><td class="score">'+esc(x.final_priority)+'</td><td>'+badge(x.alert_level)+'</td><td>'+esc(x.recommendation)+'</td></tr>'}).join('')+'</table></div>'}function dashView(){let red=opps.filter(x=>x.alert_level==='红').length,trial=opps.reduce((a,x)=>a+(+x.trial_volume||0),0),switchable=opps.reduce((a,x)=>a+(+x.switchable_volume||0),0),high=customers.filter(x=>+x.cv_score>=75).length;$('#view').innerHTML='<div class="kpis"><div class="card kpi"><span class="muted">客户总数</span><b>'+customers.length+'</b></div><div class="card kpi"><span class="muted">A/S级客户</span><b>'+high+'</b></div><div class="card kpi"><span class="muted">红灯商机</span><b>'+red+'</b></div><div class="card kpi"><span class="muted">首批试柜</span><b>'+Math.round(trial)+'</b></div></div><div class="card" style="margin-top:11px"><div class="sec"><h2>Top 商机</h2><span class="muted">最终作战优先分排序</span></div>'+oppTable(opps.slice(0,10))+'</div><div class="notice">可切换柜量合计：<b>'+Math.round(switchable)+'</b>。客户价值CV与当前商机分开计算，系统同时考虑OT、DC、DP、AQ和东/西货切换机会。</div>'}function customersView(){let rows=customers.length?'<div class="table"><table><tr><th>客户</th><th>类型</th><th>DP</th><th>年柜量</th><th>水果</th><th>CV</th><th>等级</th><th>DC</th><th>下一步</th></tr>'+customers.map(x=>'<tr><td>'+esc(x.company_name)+'</td><td>'+esc(x.customer_type)+'</td><td>'+esc(x.decision_power)+'</td><td>'+esc(x.annual_containers)+'</td><td>'+esc(x.core_fruits)+'</td><td class="score">'+esc(x.cv_score)+'</td><td>'+esc(x.cv_grade)+'</td><td>'+esc(x.dc_score)+'%</td><td>'+esc(x.next_action)+'</td></tr>').join('')+'</table></div>':'<div class="empty">暂无客户</div>';$('#view').innerHTML='<div class="card"><div class="sec"><h2>客户数据库</h2><button id="newC" class="btn primary">+ 新客户</button></div>'+rows+'</div><div id="formbox"></div>';$('#newC').onclick=customerForm}function opts(max,step){let s='';for(let i=0;i<=max;i+=step)s+='<option value="'+i+'">'+i+'</option>';return s}function customerForm(){$('#formbox').innerHTML='<div class="card" style="margin-top:11px"><h2>新增客户｜第一次拜访核心数据</h2><div class="notice">第一次拜访只采集决定“要不要继续”的关键数据，目标15分钟，最多20分钟。</div><form id="cf" class="grid"><div class="f"><label>公司*</label><input name="company_name" required></div><div class="f"><label>联系人</label><input name="contact_name"></div><div class="f"><label>客户类型</label><select name="customer_type"><option>货主+代卖</option><option>货主</option><option>代卖</option><option>其他</option></select></div><div class="f"><label>决策权DP 0–10</label><input name="decision_power" type="number" min="0" max="10" value="5"></div><div class="f"><label>年进口柜量</label><input name="annual_containers" type="number"></div><div class="f"><label>月均柜量</label><input name="monthly_containers" type="number"></div><div class="f"><label>核心水果</label><input name="core_fruits"></div><div class="f"><label>国家/产区</label><input name="origin_countries"></div><div class="f"><label>当前口岸</label><input name="current_ports"></div><div class="f"><label>运输方式</label><select name="transport_mode"><option>陆运</option><option>海运</option><option>陆运+海运</option><option>未知</option></select></div><div class="f"><label>Q 品类价值 0–15</label><select name="q_score">'+opts(15,3)+'</select></div><div class="f"><label>P 痛点强度 0–15</label><select name="p_score">'+opts(15,3)+'</select></div><div class="f"><label>T FONKON匹配 0–15</label><select name="t_score">'+opts(15,3)+'</select></div><div class="f"><label>R 专业服务需求 0–10</label><select name="r_score">'+opts(10,2)+'</select></div><div class="f"><label>M 付费能力 0–10</label><select name="m_score">'+opts(10,2)+'</select></div><div class="f"><label>F 合作行为 0–10</label><select name="f_score">'+opts(10,2)+'</select></div><div class="f"><label>W 战略价值 0–5</label><select name="w_score">'+opts(5,1)+'</select></div><div class="f"><label>证据等级</label><select name="evidence_level"><option>A</option><option>B</option><option selected>C</option><option>D</option><option>未知</option></select></div><div class="f f12"><label>最大痛点/客户原话</label><textarea name="notes"></textarea></div><div class="f f12"><label>下一步</label><input name="next_action"></div><div class="f f12"><button class="btn primary">保存并自动评分</button></div></form></div>';$('#cf').onsubmit=saveC}async function saveC(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));['decision_power','annual_containers','monthly_containers','q_score','p_score','t_score','r_score','m_score','f_score','w_score'].forEach(k=>o[k]=o[k]===''?null:+o[k]);let s=calcC(o);o.created_by=ses.user.id;o.owner_id=ses.user.id;o.v_score=s.v;o.cv_score=s.cv;o.cv_grade=s.g;o.data_completeness=s.cp;o.evidence_confidence=s.ec;o.dc_score=s.dc;delete o.evidence_level;await req('/rest/v1/customers',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});await refresh();customersView()}function oppView(){$('#view').innerHTML='<div class="card"><div class="sec"><h2>商机数据库</h2><button id="newO" class="btn primary">+ 新商机</button></div>'+oppTable(opps)+'</div><div id="formbox"></div>';$('#newO').onclick=oppForm}function oppForm(){if(!customers.length)return alert('请先录入客户');let co=customers.map(x=>'<option value="'+x.id+'">'+esc(x.company_name)+'</option>').join('');$('#formbox').innerHTML='<div class="card" style="margin-top:11px"><h2>新增商机｜客户×水果×季节×口岸</h2><form id="of" class="grid"><div class="f"><label>客户*</label><select name="customer_id">'+co+'</select></div><div class="f"><label>水果*</label><input name="fruit" required></div><div class="f"><label>东/西货</label><select name="cargo_group"><option>东货</option><option>西货</option></select></div><div class="f"><label>来源国</label><input name="origin_country"></div><div class="f"><label>产区</label><input name="origin_region"></div><div class="f"><label>当前口岸</label><input name="current_port"></div><div class="f"><label>当前总时效/天</label><input name="current_total_days" type="number" step=".1"></div><div class="f"><label>江门总时效/天</label><input name="jiangmen_total_days" type="number" step=".1"></div><div class="f"><label>旺季排队/小时</label><input name="current_queue_hours" type="number" step=".1"></div><div class="f"><label>查验率%</label><input name="inspection_rate" type="number" step=".1"></div><div class="f"><label>送检率%</label><input name="testing_rate" type="number" step=".1"></div><div class="f"><label>查验耗时/天</label><input name="inspection_days" type="number" step=".1"></div><div class="f"><label>送检耗时/天</label><input name="testing_days" type="number" step=".1"></div><div class="f"><label>当前成本/柜</label><input name="current_cost_per_container" type="number"></div><div class="f"><label>江门成本/柜</label><input name="jiangmen_cost_per_container" type="number"></div><div class="f"><label>集中上市压力 0–10</label><select name="season_pressure">'+opts(10,2)+'</select></div><div class="f"><label>需求明确 0–25</label><select name="demand_score">'+opts(25,5)+'</select></div><div class="f"><label>项目时间 0–25</label><select name="timing_score">'+opts(25,5)+'</select></div><div class="f"><label>行为信号 0–25</label><select name="behavior_score">'+opts(25,5)+'</select></div><div class="f"><label>决策进度 0–15</label><select name="decision_score">'+opts(15,5)+'</select></div><div class="f"><label>竞争窗口 0–10</label><select name="competition_score">'+opts(10,5)+'</select></div><div class="f"><label>总进口量</label><input name="total_volume" type="number"></div><div class="f"><label>可匹配量</label><input name="matchable_volume" type="number"></div><div class="f"><label>可切换量</label><input name="switchab abel>客户原话</label><textarea name="customer_quote"></textarea></div><div class="f6"><label>商业假设</label><textarea name="hypothesis"></textarea></div><div class="f6"><label>验证结果</label><textarea name="validation_result"></textarea></div><div class="f f12"><label>下一步</label><input name="next_action"></div><div class="f f12"><button class="btn primary">保存拜访记录</button></div></form></div>';$('#vf').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.created_by=ses.user.id;o.duration_minutes=o.duration_minutes?+o.duration_minutes:null;await req('/rest/v1/visits',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(o)});alert(o.duration_minutes>20?'已保存；本次超过20分钟，请复盘无效沟通。':'已保存')}}async function knowView(){try{let a=await Promise.all([req('/rest/v1/fruit_seasons?select=*&limit=50'),req('/rest/v1/land_port_stats?select=*&limit=50'),req('/rest/v1/jiangmen_routes?select=*&limit=50')]);let tb=(rows,cols)=>!rows.length?'<div class="empty">暂无真实数据，后续持续沉淀</div>':'<div class="table"><table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'</tr>').join('')+'</table></div>';$('#view').innerHTML='<div class="card"><h2>水果产区/集中上市</h2>'+tb(a[0],['fruit','cargo_group','country','region','peak_start_month','peak_end_month','annual_output_tons','evidence_level'])+'</div><div class="card" style="margin-top:10px"><h2>东货陆路口岸</h2>'+tb(a[1],['port_name','fruit','month','normal_clearance_days','peak_clearance_days','avg_queue_hours','inspection_rate','testing_rate','congestion_index'])+'</div><div class="card" style="margin-top:10px"><h2>江门航线</h2>'+tb(a[2],['cargo_group','country','origin_region','origin_port','origin_to_hk_days','hk_transfer_days','hk_to_jiangmen_days','jiangmen_clearance_days','total_days','total_cost_per_container'])+'</div>'}catch(e){$('#view').innerHTML='<div class="card empty">'+esc(e.message)+'</div>'}}function teamView(){if(!['admin','manager'].includes(pr
