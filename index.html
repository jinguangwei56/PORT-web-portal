<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f49"><title>FONKON Market OS 1.2</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#061f33,#082f49);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff}.loader{text-align:center;padding:28px}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#14b8a6,#06b6d4);font-size:28px;font-weight:950;box-shadow:0 18px 40px rgba(6,182,212,.25)}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:#bae6fd;margin-top:7px}.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.18);border-top-color:#5eead4;border-radius:50%;margin:22px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loader"><div class="mark">F</div><div class="title">FONKON Market OS</div><div class="sub" id="status">正在加载正式版 1.2…</div><div class="spin"></div></div><script>(async()=>{try{const files=['assets/formal/p1.txt','assets/formal/p2.txt','assets/formal/p3.txt','assets/formal/p4.txt','assets/formal/p5.txt','assets/formal/p6a.txt','assets/formal/p6b.txt','assets/formal/p7.txt'];const parts=await Promise.all(files.map(async p=>{const r=await fetch(p+'?v=20260822-formal-2',{cache:'no-store'});if(!r.ok)throw new Error(p+' '+r.status);return r.text()}));const html=parts.join('');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='加载失败：'+e.message+'，请刷新重试';document.querySelector('.spin').style.display='none'}})();</script></body></html>
