<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>FONKON供应链路线决策报告</title>
  <style>
    :root{--navy:#06283b;--navy2:#0a3d52;--teal:#07877e;--cyan:#0da9c1;--mint:#d8fbf4;--ink:#0f1e33;--muted:#65768a;--line:#dbe5ec;--paper:#f3f7fa;--white:#fff;--good:#087a67;--warn:#9a6700;--bad:#a63a3a;--shadow:0 22px 60px rgba(5,35,53,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#e9f4f6 0,#f5f8fb 420px,#f5f8fb 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}button,input{font:inherit}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(6,40,59,.97);backdrop-filter:blur(16px);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}.topbar-in{max-width:1180px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#15c7b5,#11a9ce);display:grid;place-items:center;font-weight:950;font-size:21px}.brand b{letter-spacing:.05em}.brand small{display:block;color:#9bdce3;font-size:11px;letter-spacing:.16em}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:10px 15px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#11b7a4,#0c9fc1);color:#fff}.btn-soft{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2)}
    .demo-banner{display:none;position:sticky;top:70px;z-index:25;background:#fff0cc;color:#744900;border-bottom:1px solid #e9c46f;padding:10px 16px;text-align:center;font-weight:900}.demo .demo-banner{display:block}.demo main:before{content:"演示数据 · DEMO";position:fixed;z-index:0;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-25deg);font-size:clamp(54px,12vw,150px);font-weight:950;color:rgba(160,95,0,.055);white-space:nowrap;pointer-events:none}
    main{max-width:1180px;margin:auto;padding:34px 22px 72px;position:relative;z-index:1}.hero{background:linear-gradient(145deg,var(--navy),var(--navy2));color:#fff;border-radius:28px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-140px;top:-190px;background:radial-gradient(circle,rgba(52,211,183,.34),transparent 68%)}.eyebrow{color:#5eead4;font-weight:900;letter-spacing:.18em;font-size:12px}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.12;margin:14px 0 8px;max-width:760px}.hero-sub{font-size:16px;color:#c6dce5}.scope{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.chip{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:13px}.demo-chip{background:#ffd98a;color:#4b3200;border-color:#ffe5ac;font-weight:950}.hero-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:26px;position:relative;z-index:1}.hero-metric{padding:16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}.hero-metric span{display:block;color:#b7d1dc;font-size:12px}.hero-metric b{font-size:24px}.readiness.good{color:#80f3d9}.readiness.warn{color:#ffd77b}
    .section{margin-top:22px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 36px rgba(5,35,53,.06)}.section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.section-title h2{margin:0;font-size:21px}.section-title p{margin:0;color:var(--muted);font-size:13px}.summary{font-size:20px;font-weight:800;line-height:1.65}.notice{border-radius:16px;padding:14px 16px;margin-top:14px;background:#eefaf7;border:1px solid #b8eee2;color:#0c665c}.notice.warn{background:#fff9e8;border-color:#f1dca0;color:#7b5800}.notice.bad{background:#fff1ee;border-color:#efb7ad;color:#8c3027}
    .route-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.route{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.route.jiangmen{border-color:#87d9cc;background:linear-gradient(180deg,#f2fffc,#fff)}.route-top{display:flex;justify-content:space-between;gap:10px}.route h3{margin:0}.score{min-width:64px;text-align:center;border-radius:13px;padding:8px;background:#edf3f6}.score b{font-size:22px;display:block}.score small{color:var(--muted)}.path{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:18px 0}.node{padding:6px 9px;border-radius:10px;background:#edf7f7;color:#174b54;font-size:12px;font-weight:750}.arrow{color:#0b9f9b;font-weight:900}.route-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}.matrix{border-collapse:collapse;width:100%;min-width:760px}.matrix th,.matrix td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.matrix th{background:#f2f6f8;font-size:12px;color:#536679;position:sticky;top:0}.matrix .group td{background:#eef8f7;color:#12645d;font-weight:900}.matrix .winner{background:#e5fbf4;color:#08735f;font-weight:900}.pending{color:#91a0ae}.win,.tag{display:inline-block;margin-left:6px;font-size:10px;border-radius:999px;padding:2px 6px;background:#0f9c85;color:#fff}.tag.neutral{background:#80909f}.tag.demo{background:#c67a00}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{margin:0;padding-left:20px}.list li{margin:7px 0}.good-box{border-top:4px solid #0b9c84}.gap-box{border-top:4px solid #d99931}.recommend{background:linear-gradient(135deg,#e8fbf7,#e9f8fc);border-color:#a9e2dc}.recommend strong{font-size:20px;color:#086f66}.fine{font-size:12px;color:var(--muted)}
    .segment-block{border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-top:14px}.segment-head{padding:12px 15px;background:#edf7f7;font-weight:900;display:flex;justify-content:space-between}.segment-table{border-collapse:collapse;width:100%;min-width:900px}.segment-table th,.segment-table td{padding:10px;border-top:1px solid var(--line);font-size:12px;text-align:left}.segment-table th{color:#5a6b7b;background:#fafcfd}.scenario-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.scenario{border:1px solid var(--line);border-radius:16px;padding:15px}.scenario b{display:block;margin-bottom:8px}.scenario-row{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding:7px 0;font-size:13px}.source-list{display:grid;gap:8px}.source-item{border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:12px}.source-item b{display:block}.source-item a{color:#087f78;word-break:break-all}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.model-box{background:#f5f8fa;border-radius:15px;padding:14px}.model-box code{word-break:break-all}.foot{margin-top:26px;padding:18px;text-align:center;color:#718194;font-size:12px}
    .state{max-width:620px;margin:14vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:28px;text-align:center;box-shadow:var(--shadow)}.spinner{width:34px;height:34px;border-radius:50%;border:3px solid #dce9ed;border-top-color:#10a99c;animation:spin .8s linear infinite;margin:0 auto 16px}@keyframes spin{to{transform:rotate(360deg)}}.code-form{display:grid;gap:12px;margin-top:18px}.code-wrap{display:grid;grid-template-columns:1fr auto;gap:8px}.code-form input{width:100%;padding:13px 14px;border:1px solid #c9d6de;border-radius:13px;font-size:18px;text-align:center;letter-spacing:.12em}.code-form .btn{background:linear-gradient(135deg,#0b9489,#0c9fbd);color:#fff}.show-code{border:1px solid var(--line);background:#eef2f5;border-radius:12px;padding:0 12px;font-weight:800;color:#384d61}
    .dialog{position:fixed;inset:0;z-index:50;background:rgba(4,25,38,.72);display:none;place-items:center;padding:20px}.dialog.open{display:grid}.dialog-card{background:#fff;border-radius:22px;padding:24px;max-width:340px;width:100%;text-align:center}.dialog-card h3{margin-top:0}.dialog-card img{display:block;width:240px;max-width:100%;height:auto;margin:0 auto}.dialog-card .btn{margin-top:12px;background:#edf2f5;color:#23364b}
    @media(max-width:720px){.topbar-in{padding:11px 14px}.brand small{display:none}.actions .btn{padding:8px 9px;font-size:12px}.demo-banner{top:65px;font-size:12px}main{padding:18px 14px 96px}.hero{padding:24px 20px;border-radius:22px}.hero-metrics{grid-template-columns:1fr 1fr}.hero-metric:last-child{grid-column:1/-1}.card{padding:18px;border-radius:18px}.two,.model-grid{grid-template-columns:1fr}.summary{font-size:17px}.section-title{align-items:flex-start;flex-direction:column}.route-grid{grid-template-columns:1fr}}
    @media print{body{background:#fff}.topbar,.dialog{display:none!important}.demo-banner{position:static}main{max-width:none;padding:0}.hero,.card{box-shadow:none;break-inside:avoid}.hero,.demo-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}.section{break-inside:avoid}.matrix th{position:static}.demo main:before{display:block}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in"><div class="brand"><div class="logo">F</div><div><b>FONKON</b><small>GLOBAL SUPPLY CHAIN</small></div></div><div class="actions"><button class="btn btn-soft" id="shareBtn">分享</button><button class="btn btn-soft" id="qrBtn">二维码</button><button class="btn btn-primary" id="pdfBtn">保存PDF</button></div></div></header>
  <div class="demo-banner">演示数据：仅用于体验系统功能，不得作为报价、业务承诺或正式决策依据</div>
  <main id="app"><div class="state"><div class="spinner"></div><b>正在读取安全报告…</b><p class="fine">报告数字来自审核发布时的固定快照。</p></div></main>
  <div class="dialog" id="qrDialog" role="dialog" aria-modal="true" aria-labelledby="qrTitle"><div class="dialog-card"><h3 id="qrTitle">扫码打开本报告</h3><img id="qrImage" width="240" height="240" alt="报告二维码"><p class="fine" id="qrHelp">二维码仅包含当前安全分享链接。</p><button class="btn" id="closeQr">关闭</button></div></div>
  <script>
  (()=>{
    const ENDPOINT='https://rkunyhugitvglxkdolgz.supabase.co/functions/v1/route-report',app=document.getElementById('app'),token=new URLSearchParams(location.search).get('t')||'';
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const n=v=>v===null||v===undefined||v===''?null:Number(v),fmt=(v,unit='')=>n(v)===null?'<span class="pending">待补</span>':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2})+(unit?' '+esc(unit):''),date=v=>v?new Date(v).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-';
    const statusError=(message,detail='')=>{app.innerHTML='<div class="state"><h2>'+esc(message)+'</h2><p class="fine">'+esc(detail)+'</p></div>'};
    function visitor(){try{let v=localStorage.getItem('fonkon_report_visitor_v1');if(!v){v=crypto.randomUUID();localStorage.setItem('fonkon_report_visitor_v1',v)}return v}catch{return 'browser-'+Math.random().toString(36).slice(2)}}
    function codePrompt(meta,error=''){
      app.innerHTML='<div class="state"><div class="logo" style="margin:0 auto">F</div><h2>'+esc(meta.title||'受保护的FONKON报告')+'</h2><p class="fine">报告编号 '+esc(meta.report_number||'')+'</p>'+(error?'<div class="notice warn">'+esc(error)+(meta.remaining!==undefined?'<br>剩余尝试次数：'+esc(meta.remaining):'')+(meta.locked_until?'<br>可重试时间：'+esc(date(meta.locked_until)):'')+'</div>':'')+'<form class="code-form" id="codeForm"><div class="code-wrap"><input id="reportCode" type="password" minlength="4" maxlength="32" autocomplete="one-time-code" placeholder="请输入访问密码" required><button type="button" class="show-code" id="toggleCode">显示</button></div><button class="btn">打开报告</button></form>';
      document.getElementById('toggleCode').onclick=()=>{const x=document.getElementById('reportCode'),b=document.getElementById('toggleCode'),show=x.type==='password';x.type=show?'text':'password';b.textContent=show?'隐藏':'显示'};document.getElementById('codeForm').onsubmit=e=>{e.preventDefault();load(document.getElementById('reportCode').value)};
    }
    function metricTable(report){const routes=report.routes||[],rows=report.comparison?.rows||[];let html='<div class="table-wrap"><table class="matrix"><thead><tr><th>对比维度</th><th>指标 / 权重</th>'+routes.map(r=>'<th>'+esc(r.name)+'</th>').join('')+'</tr></thead><tbody>';for(const group of rows){html+='<tr class="group"><td colspan="'+(routes.length+2)+'">'+esc(group.label)+(group.comparable?'': ' · 当前不可比较')+(group.comparable&&group.material===false?'<span class="tag neutral">差异未达阈值</span>':'')+'</td></tr>';for(const m of group.metrics){html+='<tr><td></td><td><b>'+esc(m.label)+'</b>'+(m.weight!==undefined?'<div class="fine">权重 '+esc(m.weight)+' · 阈值 '+esc(m.materiality_threshold??'-')+'</div>':'')+'</td>'+routes.map((r,i)=>'<td class="'+((m.winners||[]).includes(i)?'winner':'')+'">'+fmt(m.values?.[i],m.unit)+((m.winners||[]).includes(i)&&m.material!==false?'<span class="win">'+(m.material===undefined?'旧版领先':'实质领先')+'</span>':'')+'</td>').join('')+'</tr>'}}return html+'</tbody></table></div>'}
    function routeCards(report){const scores=report.comparison?.scores||[];return '<div class="route-grid">'+(report.routes||[]).map((r,i)=>'<article class="route '+(r.kind==='jiangmen'?'jiangmen':'')+'"><div class="route-top"><div><div class="eyebrow" style="color:#0b9385">'+esc(r.kind==='jiangmen'?'FONKON PROPOSAL':'CURRENT / ALTERNATIVE')+'</div><h3>'+esc(r.name)+'</h3></div><div class="score"><b>'+esc(scores[i]?.score??'-')+'</b><small>相对分</small></div></div><div class="path">'+(r.path||[]).map((x,j)=>'<span class="node">'+esc(x)+'</span>'+(j<(r.path||[]).length-1?'<span class="arrow">→</span>':'')).join('')+'</div><div class="route-meta"><span>运输：'+esc(r.transport||'-')+'</span><span>证据：'+esc(r.evidence?.route||'-')+'级</span><span>样本：'+esc(r.evidence?.sample_size??'待补')+'</span><span>更新：'+esc(r.evidence?.updated_at?date(r.evidence.updated_at).slice(0,10):'待补')+'</span><span>币种/柜型：'+esc(r.currency||report.scope?.currency||'-')+' / '+esc(r.container_type||report.scope?.container_type||'-')+'</span><span>成本基期：'+esc(r.cost_basis_date||'待补')+'</span></div></article>').join('')+'</div>'}
    function segmentTables(r){return (r.routes||[]).map(route=>'<div class="segment-block"><div class="segment-head"><span>'+esc(route.name)+'</span><span>'+esc((route.segments||[]).length)+'/9段</span></div><div class="table-wrap" style="border:0;border-radius:0"><table class="segment-table"><thead><tr><th>#</th><th>链路环节</th><th>节点</th><th>P50</th><th>P90</th>'+(r.show_cost?'<th>成本</th>':'')+'<th>冷链风险</th><th>证据</th><th>更新时间</th></tr></thead><tbody>'+((route.segments||[]).length?(route.segments||[]).map(s=>'<tr><td>'+esc(s.order)+'</td><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.origin||'-')+' → '+esc(s.destination||'-')+'</td><td>'+fmt(s.p50_days,'天')+'</td><td>'+fmt(s.p90_days,'天')+'</td>'+(r.show_cost?'<td>'+fmt(s.cost_amount,s.currency||'CNY')+'</td>':'')+'<td>'+fmt(s.coldchain_risk_index,'/10')+'</td><td>'+esc(s.evidence_level||'-')+'级</td><td>'+esc(s.source?.updated_at?date(s.source.updated_at).slice(0,10):'待补')+'</td></tr>').join(''):'<tr><td colspan="9" class="pending">历史报告未包含分段快照</td></tr>')+'</tbody></table></div></div>').join('')}
    function scenarios(r){const rows=r.comparison?.scenarios||[];return '<div class="scenario-grid">'+(rows.length?rows.map(x=>'<div class="scenario"><b>'+esc(x.route_name)+'</b><div class="scenario-row"><span>常态 P50</span><strong>'+fmt(x.normal_p50_days,'天')+'</strong></div><div class="scenario-row"><span>旺季 P90</span><strong>'+fmt(x.peak_p90_days,'天')+'</strong></div><div class="scenario-row"><span>监管期望情景</span><strong>'+fmt(x.regulatory_expected_days,'天')+'</strong></div></div>').join(''):'<p class="fine">历史报告未包含情景测算。</p>')+'</div>'}
    function sourceList(r){const rows=r.sources||[];return rows.length?'<details><summary><b>展开全部 '+rows.length+' 条来源与更新时间</b></summary><div class="source-list" style="margin-top:12px">'+rows.map(x=>'<div class="source-item"><b>'+esc(x.route_name)+' · '+esc(x.segment||x.level||'路线来源')+'</b><span>'+esc(x.text||'来源待补')+'</span>'+(x.url?'<br><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">查看公开来源</a>':'')+'<div class="fine">证据 '+esc(x.evidence_level||'-')+'级 · 样本 '+esc(x.sample_size??'待补')+' · 更新 '+esc(x.updated_at?date(x.updated_at).slice(0,10):'待补')+'</div></div>').join('')+'</div></details>':'<p class="fine">历史报告未包含公开来源清单。</p>'}
    function list(items,empty){return items?.length?'<ul class="list">'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="fine">'+esc(empty)+'</p>'}
    function render(r){
      document.body.classList.toggle('demo',!!r.is_demo);document.title=(r.client_name||'客户')+'｜FONKON供应链路线决策报告';const c=r.comparison||{},s=r.scope||{},ready=n(c.data_readiness?.index),legacy=n(c.confidence),leader=c.leader_index===null||c.leader_index===undefined?null:r.routes?.[c.leader_index],blockers=r.validation?.publish_blockers||[];
      app.innerHTML='<section class="hero"><div class="eyebrow">FONKON SUPPLY CHAIN DECISION REPORT</div><h1>'+esc(r.title||'供应链路线决策报告')+'</h1><div class="hero-sub">'+esc(r.client_name||'贵司')+' · 报告编号 '+esc(r.report_number||'-')+'</div><div class="scope">'+(r.is_demo?'<span class="chip demo-chip">演示数据</span>':'')+[s.cargo_group,s.fruit,s.country,s.origin_region,s.month?s.month+'月':'',s.destination,s.currency,s.container_type].filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="hero-metrics"><div class="hero-metric"><span>可比 / 实质差异维度</span><b>'+esc(c.dimension_count??0)+' / '+esc(c.material_dimension_count??'-')+'</b></div><div class="hero-metric"><span>'+(ready===null?'历史模型指标':'数据就绪与证据指数')+'</span><b class="readiness '+((ready??legacy??0)>=65?'good':'warn')+'">'+esc(ready===null?(legacy===null?'—':legacy+'%（旧）'):ready+'%')+'</b></div><div class="hero-metric"><span>当前综合领先</span><b>'+esc(leader?.name||'未形成显著领先')+'</b></div></div></section>'+
      (r.is_demo?'<section class="section card"><div class="notice bad" style="margin:0"><b>演示数据隔离提示</b><br>本报告包含模拟数据和 DEMO 水印，只用于体验功能，不得发给客户作为真实结论。</div></section>':'')+
      '<section class="section card"><div class="section-title"><h2>决策摘要</h2><p>固定规则模型计算 · 未知不按0 · 微小差异不判领先</p></div><div class="summary">'+esc(c.summary||'待补数据后判断')+'</div><div class="notice '+((ready??0)<65?'warn':'')+'">'+(ready===null?'这是旧版历史快照；建议重新生成 V2 报告后再用于业务决策。':ready<65?'当前数据就绪度不足，仅供内部评估。':'当前达到模型比较条件，仍建议通过真实试柜持续校准。')+'</div>'+(blockers.length?'<div class="notice bad"><b>发布阻断项：</b>'+esc(blockers.join('；'))+'</div>':'')+'</section>'+
      '<section class="section card"><div class="section-title"><h2>路线全链路概览</h2><p>同起点、同终点、同水果、同月份、同币种、同柜型</p></div>'+routeCards(r)+'</section>'+
      '<section class="section card"><div class="section-title"><h2>9段全链路明细</h2><p>每段时效、成本、风险与证据可追溯</p></div>'+segmentTables(r)+'</section>'+
      '<section class="section card"><div class="section-title"><h2>常态、旺季与监管情景</h2><p>监管情景＝P50＋查验概率×时长＋送检概率×时长</p></div>'+scenarios(r)+'</section>'+
      '<section class="section card"><div class="section-title"><h2>10维度同口径对比</h2><p>只有超过实质性阈值的差异才标记领先</p></div>'+metricTable(r)+'</section>'+
      '<section class="section two"><div class="card good-box"><div class="section-title"><h2>江门当前优势</h2></div>'+list(c.jiangmen_advantages,'当前未形成达到阈值的明确优势。')+'</div><div class="card gap-box"><div class="section-title"><h2>江门当前短板</h2></div>'+list(c.jiangmen_gaps,'当前未发现达到阈值的明显短板。')+'</div></section>'+

      '<section class="section card"><div class="section-title"><h2>模型与审核披露</h2><p>计算不是AI自由生成</p></div><div class="model-grid"><div class="model-box"><b>计算模型</b><p class="fine">版本：'+esc(r.model_version||r.model?.code||'历史模型')+'<br>方法：'+esc(r.model?.method||r.generated_method||'固定规则模型')+'<br>总权重：'+esc(r.model?.weight_total??'历史配置')+'</p></div><div class="model-box"><b>审核与完整性</b><p class="fine">审核状态：'+esc(r.approval?.status||'历史已发布')+'<br>审核时间：'+esc(date(r.integrity?.approved_at||r.approval?.approved_at))+'<br>快照指纹：<code>'+esc(r.integrity?.snapshot_hash||'历史报告无指纹')+'</code></p></div></div></section>'+

    async function load(code=''){if(!token)return statusError('分享链接无效','缺少安全报告凭证。');try{const headers={'x-report-visitor':visitor()};if(code)headers['x-report-code']=code;const res=await fetch(ENDPOINT+'?token='+encodeURIComponent(token),{cache:'no-store',headers}),body=await res.json().catch(()=>({}));if((res.status===401||res.status===429)&&body.requires_code)return codePrompt(body,body.error||'');if(!res.ok)throw Error(body.error||'报告暂时无法打开');render(body.report)}catch(e){statusError(e.message||'报告暂时无法打开','请联系向您发送报告的FONKON业务顾问。')}}
    document.getElementById('pdfBtn').onclick=()=>window.print();document.getElementById('shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,text:'FONKON供应链路线决策报告',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('报告链接已复制')}}catch{}};document.getElementById('qrBtn').onclick=()=>{const d=document.getElementById('qrDialog'),img=document.getElementById('qrImage'),help=document.getElementById('qrHelp');d.classList.add('open');help.textContent='二维码仅包含当前安全分享链接。';img.onerror=()=>{help.textContent='二维码生成失败，请使用“分享”复制链接。'};img.src=ENDPOINT+'?qr=1&token='+encodeURIComponent(token)+'&v='+Date.now()};document.getElementById('closeQr').onclick=()=>document.getElementById('qrDialog').classList.remove('open');document.getElementById('qrDialog').onclick=e=>{if(e.target.id==='qrDialog')e.currentTarget.classList.remove('open')};load();
  })();
