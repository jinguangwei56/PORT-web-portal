<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FONKON 主管看板</title><style>body{font-family:system-ui;margin:24px;max-width:1100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:18px}.num{font-size:28px;font-weight:700}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left}</style></head><body><h1>FONKON 主管看板</h1><div class="grid"><div class="card">客户总数<div class="num" id="total">-</div></div><div class="card">A级以上<div class="num" id="hot">-</div></div><div class="card">预计可争取柜量<div class="num" id="aq">-</div></div></div><div class="card"><h2>优先客户</h2><table><thead><tr><th>客户</th><th>PI</th><th>等级</th><th>预警</th><th>AQ</th></tr></thead><tbody id="rows"></tbody></table></div><script>async function load(){const r=await fetch('/api/v1/dashboard');if(!r.ok)return;const d=await r.json();document.querySelector('#total').textContent=d.totalCustomers;document.querySelector('#hot').textContent=(d.gradeDistribution.S||0)+(d.gradeDistribution.A||0);document.querySelector('#aq').textContent=d.totalAQ;document.querySelector('#rows').innerHTML=(d.priorityCustomers||[]).map(x=>`<tr><td>${x.customerId}</td><td>${x.pi??'-'}</td><td>${x.grade??'-'}</td><td>${x.warning??'-'}</td><td>${x.aq??0}</td></tr>`).join('')}</script><button onclick="load()">刷新数据</button></body></html>
