<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082f49"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>FONKON Market OS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#061f33,#082f49);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#fff}.loader{text-align:center;padding:28px}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 16px;display:grid;place-items:center;background:linear-gradient(135deg,#14b8a6,#06b6d4);font-size:28px;font-weight:950}.title{font-size:20px;font-weight:900}.sub{font-size:12px;color:#bae6fd;margin-top:7px}.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.18);border-top-color:#5eead4;border-radius:50%;margin:22px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="loader"><div class="mark">F</div><div class="title">FONKON Market OS</div><div class="sub" id="status">正在启动…</div><div class="spin"></div></div><script>(async()=>{
 try{
  const V='20260824-r11-1-reports3';
  const base=['assets/formal/p1.txt','assets/formal/p2.txt','assets/formal/p3.txt','assets/formal/p4.txt','assets/formal/p5.txt','assets/formal/p6a.txt','assets/formal/p6b.txt','assets/formal/p7.txt'];
  const modules=['assets/strict2/a.js.txt','assets/strict2/b.js.txt','assets/strict2/c.js.txt','assets/strict2/d.js.txt','assets/knowledge2/e.js.txt','assets/knowledge2/f.js.txt','assets/knowledge2/g.js.txt','assets/knowledge2/h.js.txt','assets/admin2/a.js.txt','assets/stage3/a.js.txt','assets/stage3/b.js.txt','assets/stage3/c.js.txt','assets/stage3/e.js.txt','assets/stage3/f.js.txt','assets/stage3/g.js.txt','assets/stage3/r.js.txt','assets/stage3/t.js.txt','assets/stage3/u.js.txt','assets/stage3/v.js.txt','assets/stage3/w.js.txt','assets/stage3/x.js.txt','assets/stage3/y.js.txt','assets/r11/core.js.txt','assets/r11/finalize.js.txt','assets/r11/paging.js.txt'];
  const status=document.getElementById('status');
  const load=async p=>{const r=await fetch(p+'?v='+V,{cache:'no-store'});if(!r.ok)throw Error(p+' '+r.status);return r.text()};
  const exact=(code,needle,replacement,label)=>{if(!code.includes(needle))throw Error('R11模块收口校验失败：'+label);return code.replace(needle,replacement)};
  const patchModule=(p,code)=>{
    if(p==='assets/stage3/a.js.txt')code=exact(code,"setTimeout(()=>{if(profile)injectNav()},400);","window.__r11LegacyInjectNav=injectNav;",'stage3/a startup');
    if(p==='assets/stage3/g.js.txt'){
      code=exact(code,"if(tm){tm.dataset.fullText=tm.dataset.fullText||tm.textContent;const target=mobile?'Market OS · 运营增强版 R4':tm.dataset.fullText;if(tm.textContent!==target)tm.textContent=target}","if(tm){tm.dataset.fullText=tm.dataset.fullText||tm.textContent}",'stage3/g top-meta');
      code=exact(code,"[80,500,1200,2500].forEach(ms=>setTimeout(polishMobileHeader,ms));","window.__r11MobilePolish=polishMobileHeader;",'stage3/g timers');
    }
    if(p==='assets/stage3/r.js.txt'){
      code=exact(code,"[40,300,800,1600,3000,4500].forEach(ms=>setTimeout(()=>{mountTools();mark()},ms));","window.__r11MountTools=mountTools;",'stage3/r timers');
      code=exact(code,"else if(routed?.dataset.r102Action==='selfcheck')await selfCheck();","else if(routed?.dataset.r102Action==='selfcheck')await (typeof window.fonkonR11SelfCheckUI==='function'?window.fonkonR11SelfCheckUI():selfCheck());",'stage3/r selfcheck');
    }
    if(p==='assets/stage3/t.js.txt')code=exact(code,"[100,700,1800,3200,4800,6500,10000].forEach(ms=>setTimeout(finalMark,ms));","window.__r11AuditReady=true;",'stage3/t timers');
    if(p==='assets/stage3/v.js.txt'){
      code=exact(code,"[80,500,1500,3500,7000].forEach(ms=>setTimeout(mark,ms));","window.__r11SessionGuardianReady=true;",'stage3/v mark timers');
      code=exact(code,"setTimeout(()=>{if(readStored()?.access_token){ensureProfileStable(false).then(()=>{try{oldShow()}catch{}}).catch(()=>{})}},120);","window.__r11LegacySessionAutoboot=()=>{};",'stage3/v autoboot');
    }
    if(p==='assets/stage3/w.js.txt')code=exact(code,"[60,300,900,1800].forEach(ms=>setTimeout(()=>{mountNav();mark()},ms));","window.__r11FuelNav=mountNav;",'stage3/w timers');
    if(p==='assets/stage3/x.js.txt')code=exact(code,"[80,300,900,1800,4000,8000].forEach(ms=>setTimeout(()=>{addNav();mark()},ms));","window.__r11RouteNav=addNav;",'stage3/x timers');
    return code;
  };
  if(status)status.textContent='正在装载业务模块…';
  const [bp,mpRaw]=await Promise.all([Promise.all(base.map(load)),Promise.all(modules.map(load))]);
  let html=bp.join('');
  html=html.replace("function setNav(v){$$('.nav-btn,.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}","function setNav(v){Array.from(document.querySelectorAll('.nav-btn,.bottom-nav button')).forEach(b=>b.classList.toggle('active',b.dataset.view===v))}");
  html=html.replace("$$('.nav-btn,.bottom-nav button').forEach(b=>b.onclick=()=>{setNav(b.dataset.view);render(b.dataset.view)});","Array.from(document.querySelectorAll('.nav-btn,.bottom-nav button')).forEach(b=>b.onclick=()=>{setNav(b.dataset.view);render(b.dataset.view)});");
  const bootStart="(async()=>{\n  const authish=e=>";
  const endToken="\n})();\n"+"<"+"/script>";
  const bi=html.lastIndexOf(bootStart);
  if(bi<0)throw Error('未找到旧启动器，R11拒绝叠加启动');
  const bj=html.indexOf(endToken,bi);
  if(bj<0)throw Error('旧启动器结束位置异常');
  html=html.slice(0,bi)+'window.__fonkonLegacyBoot=async()=>{};'+html.slice(bj+"\n})();".length);
  const mp=mpRaw.map((c,i)=>patchModule(modules[i],c));
  const pre='<script>window.__FONKON_R11_LOADER={version:"'+V+'",startedAt:Date.now()};<\/script>';
  html=html.replace('<body>','<body>'+pre);
  const tags=mp.map((code,i)=>'<script data-fonkon-module="'+modules[i]+'">'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>').join('');
  const out=html.replace('</body>',tags+'</body>');
  document.open();document.write(out);document.close();
 }catch(e){const s=document.getElementById('status');if(s)s.textContent='R11.1加载失败：'+e.message;const spin=document.querySelector('.spin');if(spin)spin.style.display='none';console.error(e)}
})();</script></body></html>
