<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FONKON 客户量化访谈</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}button{padding:12px 20px;border:0;border-radius:8px;cursor:pointer}.card{border:1px solid #ddd;border-radius:12px;padding:24px;margin:16px 0}input,select,textarea{width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box}.muted{color:#666}.score{font-size:32px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>FONKON 客户量化访谈</h1><div class="muted" id="progress"></div><div class="card"><h2 id="stage">业务事实</h2><p id="question"></p><div id="input"></div><label>证据/客户原话（不计入分数，只用于审计）</label><textarea id="evidence" rows="3" placeholder="例如：客户说‘过去一个月有3柜送检’"></textarea><button id="next">保存并下一步</button></div><div class="card" id="result" hidden><h2>评分结果</h2><div class="score" id="cv"></div><p id="grade"></p><p id="ot"></p><p id="pi"></p><p id="aq"></p><p id="warning"></p><p id="action"></p><p id="confidence"></p></div><script>
const flow=[
 ['volume','业务规模','一年大概进口多少柜？','annualImportContainers','number'],
 ['pain','痛点频率','这种问题一个月大概发生几次？','painFrequencyMonthly','number'],
 ['impact','影响天数','每次大约影响几天？','impactDays','number'],
 ['loss','经济损失','一柜大概损失/增加多少成本？','estimatedLossPerContainer','number'],
 ['premium','支付意愿','如果问题被稳定解决，每柜增加多少服务成本可以接受？','willingPremiumPerContainer','number'],
 ['project','项目时间','下一批货距离现在多少天？','projectDays','number'],
 ['decision','决策链','目前您属于哪种决策角色？','decisionMakerContact','select'],
 ['competitor','竞争窗口','目前有几家供应商在比较？','competitorCount','number'],
 ['trial','试柜意愿','愿意先拿多少柜做对比测试？','firstTrialContainers','number']
];
let i=0,answers={},evidence={};
function render(){let x=flow[i];document.querySelector('#stage').textContent=x[1];document.querySelector('#question').textContent=x[2];document.querySelector('#progress').textContent=`第 ${i+1} / ${flow.length} 步`;let el=document.querySelector('#input');if(x[4]==='select'){el.innerHTML='<select id="value"><option value="未知">未知</option><option value="影响者">影响者</option><option value="已接触决策人">已接触决策人</option><option value="已确认决策人">已确认决策人</option></select>'}else{el.innerHTML='<input id="value" type="number" min="0" step="0.01" placeholder="请输入数字">'}document.querySelector('#evidence').value='';}
document.querySelector('#next').onclick=async()=>{let x=flow[i],v=document.querySelector('#value').value;if(v==='')return alert('请先录入量化数据');answers[x[3]]=x[4]==='number'?Number(v):v;evidence[x[3]]=document.querySelector('#evidence').value;i++;if(i<flow.length)return render();document.querySelector('#next').disabled=true;try{let r=await fetch('/api/v1/customers/score',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...answers,evidenceV:evidence.annualImportContainers,evidenceP:evidence.painFrequencyMonthly,evidenceR:evidence.impactDays,evidenceM:evidence.willingPremiumPerContainer})});let s=await r.json();if(!r.ok)throw Error(s.message||'评分失败');document.querySelector('#result').hidden=false;document.querySelector('#cv').textContent=`CV ${s.scores.CV} / 100`;document.querySelector('#grade').textContent=`客户等级：${s.scores.grade}`;document.querySelector('#ot').textContent=`OT ${s.opportunity.OT} / 100`;document.querySelector('#pi').textContent=`PI ${s.opportunity.PI}`;document.querySelector('#aq').textContent=`首批试柜：${s.aq.firstTrialContainers} 柜；意向试柜：${s.aq.willingTrialContainers} 柜`;document.querySelector('#warning').textContent=`预警：${s.warning}`;document.querySelector('#action').textContent=`下一动作：${s.action}`;document.querySelector('#confidence').textContent=`数据完整度：${s.completeness}%｜证据数量：${s.evidenceCount}｜可信度：${s.confidence}`}catch(e){document.querySelector('#result').hidden=false;document.querySelector('#action').textContent='评分失败：请检查Backend API地址或字段配置。'}};render();</script></body></html>
