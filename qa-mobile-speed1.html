<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FONKON Mobile QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#dbe3ec;color:#0f172a;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}.qa{min-height:100vh;display:grid;place-items:center;padding:24px}.device{width:414px;max-width:100%;background:#111827;border:12px solid #111827;border-radius:30px;box-shadow:0 24px 70px rgba(15,23,42,.25);overflow:hidden}.meta{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;background:#111827;color:#cbd5e1;font-size:11px}.screen{display:block;width:390px;max-width:100%;height:844px;border:0;background:#fff}
  </style>
</head>
<body>
  <main class="qa">
    <section class="device" aria-label="390乘844手机端验证框">
      <div class="meta"><span>FONKON 手机端验证</span><span id="qaMetrics">390 × 844</span></div>
      <iframe id="mobileFrame" class="screen" title="FONKON Market OS 手机端" src="app-r11-1.html?v=20260826-r11-1-geo1&amp;qa=mobile" loading="eager"></iframe>
    </section>
  </main>
  <script>
    const frame=document.getElementById('mobileFrame'),metrics=document.getElementById('qaMetrics');
    frame.addEventListener('load',()=>{const poll=setInterval(()=>{try{const root=frame.contentDocument?.documentElement,boot=root?.dataset?.fonkonBootMs,view=root?.dataset?.fonkonView,render=root?.dataset?.fonkonRenderMs;if(boot){metrics.textContent='启动 '+boot+'ms · '+(view||'页面')+' '+(render||'-')+'ms';clearInterval(poll)}}catch{}},100)});
  </script>
</body>
</html>
